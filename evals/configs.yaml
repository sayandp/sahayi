  rewrite: true
  rerank: true
  rerank_backend: onnx
  rerank_onnx_file: bge-reranker-v2-m3/model_int8.onnx
  rerank_pool: 10

dense_rw_api:
  mode: dense
  rewrite: true
  rerank: true
  rerank_backend: api
  rerank_provider: cohere
  rerank_pool: 20

# Variant weighting (fixed before running): the user's own words count fully,
