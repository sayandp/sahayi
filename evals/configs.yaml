  rerank_model: jinaai/jina-reranker-v2-base-multilingual
  rerank_backend: onnx
  rerank_onnx_file: "hub:onnx/model_int8.onnx"
  rerank_pool: 10
  rerank_skip_margin: 0.05

hybrid_rw_jina5:
  mode: hybrid
  rewrite: true
  rerank: true
  rerank_model: jinaai/jina-reranker-v2-base-multilingual
  rerank_backend: onnx
  rerank_onnx_file: "hub:onnx/model_int8.onnx"
