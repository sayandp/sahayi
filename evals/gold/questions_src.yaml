# Gold questions (source). `python evals/build_gold.py` resolves each question's
# `evidence` strings to gold (doc_id, page) pairs and writes questions.jsonl.
#
#   id        unique
#   lang      ml | en | manglish  (Manglish = Malayalam in Latin script)
#   type      answerable | no_answer
#   schemes   scheme_ids whose documents may hold the answer (limits the evidence search)
#   evidence  verbatim snippets (case/space-insensitive) from the source pages that
#             support the answer; every page containing ANY snippet is a gold page.
#   answer    short reference answer (for Phase 3/4 checks), optional
#
# Written 2026-10-12 against the Phase 1c corpus by the same agent that built the
# retriever: treat as a starting point and review before using results as a gate.

