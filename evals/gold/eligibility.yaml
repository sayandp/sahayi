# Phase 3 eligibility cases (15): a stated profile, the scheme it asks about and the
# expected eligible value (true / false / null = a required fact is missing).
# Each verdict was checked by hand against the cited chunks; `evidence` quotes are
# verbatim and evals/answer_eval.py fails if a quote is not in its chunk.
# Written 2026-10-20 by Claude (the generator and judge are other model families).

cases:
  - id: e001
    lang: en
    question: "I am 35, I have a savings bank account and I have never paid income tax. Can I join Atal Pension Yojana?"
    expected: [{scheme_id: apy, eligible: true}]
    evidence:
      - {chunk_id: "apy--apy-234e9e:1:2", quote: "The minimum age of joining APY is 18 years and maximum is 40 years."}
      - {chunk_id: "apy--apy-234e9e:1:3", quote: "any citizen who is or has been an income tax payer, shall not be eligible to join APY."}

  - id: e002
    lang: en
    question: "I'm 45 years old and have a savings account. Can I still join Atal Pension Yojana?"
    expected: [{scheme_id: apy, eligible: false}]
    evidence:
      - {chunk_id: "apy--apy-234e9e:1:2", quote: "The minimum age of joining APY is 18 years and maximum is 40 years."}

  - id: e003
    lang: manglish
    question: "ente amma 67 vayassanu, Indian citizen aanu, BPL kudumbam aanu. Indira Gandhi old age pension kittumo?"
    expected: [{scheme_id: nsap_ignoaps, eligible: true}]
    evidence:
      - {chunk_id: "nsap_ignoaps--nsap-ignoaps-9c99d4:1:2", quote: "The applicant should be at least 60 years of age."}

  - id: e004
    lang: en
    question: "I am 55 and my family is above the poverty line. Am I eligible for the Indira Gandhi National Old Age Pension?"
    expected: [{scheme_id: nsap_ignoaps, eligible: false}]
    evidence:
      - {chunk_id: "nsap_ignoaps--nsap-ignoaps-9c99d4:1:2", quote: "The applicant should be living Below Poverty Line."}

  - id: e005
    lang: ml
    question: "എനിക്ക് 50 വയസ്സായി, ഭർത്താവ് മരിച്ചു, ഞങ്ങൾ ദാരിദ്ര്യരേഖയ്ക്ക് താഴെയുള്ള (BPL) കുടുംബമാണ്. ഇന്ദിരാ ഗാന്ധി ദേശീയ വിധവാ പെൻഷന് അർഹതയുണ്ടോ?"
    expected: [{scheme_id: nsap_ignwps, eligible: true}]
    evidence:
      - {chunk_id: "nsap_ignwps--ignwps-0932bc:1:2", quote: "The applicant must be a widow in the age group of 40-79 years."}

  - id: e006
    lang: en
    question: "I am a 35-year-old widow from a BPL household. Can I get the Indira Gandhi National Widow Pension?"
    expected: [{scheme_id: nsap_ignwps, eligible: false}]
    evidence:
      - {chunk_id: "nsap_ignwps--ignwps-0932bc:1:2", quote: "The applicant must be a widow in the age group of 40-79 years."}

  - id: e007
    lang: en
    question: "My husband passed away last year. Can I get the Indira Gandhi National Widow Pension?"
    expected: [{scheme_id: nsap_ignwps, eligible: null}]  # age and BPL status not stated
    evidence:
      - {chunk_id: "nsap_ignwps--ignwps-0932bc:1:2", quote: "The applicant should belong to a household living below the poverty line"}

  - id: e008
    lang: en
    question: "My brother is 30, an Indian resident with 85% disability, and our family is BPL. Is he eligible for the Indira Gandhi National Disability Pension?"
    expected: [{scheme_id: nsap_igndps, eligible: true}]
    evidence:
      - {chunk_id: "nsap_igndps--igndps-f97cb2:1:2", quote: "The applicant's disability should be more than 80%."}

  - id: e009
    lang: manglish
    question: "enikku 60% disability und, vayassu 40, BPL card und. Indira Gandhi disability pension kittumo?"
    expected: [{scheme_id: nsap_igndps, eligible: false}]
    evidence:
      - {chunk_id: "nsap_igndps--igndps-f97cb2:1:2", quote: "The applicant's disability should be more than 80%."}

  - id: e010
    lang: en
    question: "I'm a 30-year-old small farmer with 1 hectare of cultivable land, in the land records in my name since 2015. I have Aadhaar and a savings bank account. Can I join PM Kisan Maandhan Yojana?"
    expected: [{scheme_id: pm_kmy, eligible: true}]
    evidence:
      - {chunk_id: "pm_kmy--pmkmdy-44b6ea:1:2", quote: "The applicant should be between 18 and 40 years of age at the time of entry."}
      - {chunk_id: "pm_kmy--pmkmdy-44b6ea:1:2", quote: "The applicant's name should appear in land records as on 01.08.2019."}

  - id: e011
    lang: en
    question: "I am a 52-year-old marginal farmer with half a hectare. Can I join the PM Kisan Maandhan pension scheme?"
    expected: [{scheme_id: pm_kmy, eligible: false}]
    evidence:
      - {chunk_id: "pm_kmy--pmkmdy-44b6ea:1:2", quote: "The applicant should be between 18 and 40 years of age at the time of entry."}

  - id: e012
    lang: ml
    question: "ഞാൻ 25 വയസ്സുള്ള സ്ത്രീയാണ്, ഞങ്ങളുടേത് ദരിദ്ര കുടുംബമാണ്, വീട്ടിൽ ഒരു LPG കണക്ഷനും ഇല്ല. ഉജ്ജ്വല യോജന വഴി ഗ്യാസ് കണക്ഷൻ കിട്ടുമോ?"
    expected: [{scheme_id: pmuy, eligible: true}]
    evidence:
      - {chunk_id: "pmuy--ujjwala2-70400f:1:1", quote: "The applicant must be a woman who has attained 18 years of age."}

  - id: e013
    lang: en
    question: "I'm a 30-year-old man from a poor family and we have no LPG connection. Can I apply for PM Ujjwala Yojana?"
    expected: [{scheme_id: pmuy, eligible: false}]
    evidence:
      - {chunk_id: "pmuy--pmuy-6c9914:1:3", quote: "Male Member from a household cannot apply for the scheme."}

  - id: e014
    lang: en
    question: "I'm a 32-year-old self-employed craftsperson working with hand tools, and I took a PMEGP loan two years ago. Can I register under PM Vishwakarma?"
    expected: [{scheme_id: pm_vishwakarma, eligible: false}]
    evidence:
      - {chunk_id: "pm_vishwakarma--pmv-378966:1:2", quote: "e.g. PMEGP, PM SVANidhi, Mudra, in the past 5 years."}

  - id: e015
    lang: en
    question: "I own farmland in my name, but I paid income tax in the last assessment year. Am I eligible for PM-KISAN?"
    expected: [{scheme_id: pm_kisan, eligible: false}]
    evidence:
      - {chunk_id: "pm_kisan--pm-kisan-488a46:1:3", quote: "All Persons who paid Income Tax in last assessment year"}
