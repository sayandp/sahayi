[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# eval scripts and tests carry long data literals (questions, model ids, specs)
"evals/**" = ["E501"]
"backend/tests/**" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
