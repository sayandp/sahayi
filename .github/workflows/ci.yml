name: CI

on: push

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Tests mock every provider. Empty keys make a real call impossible.
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""
      JINA_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies (CPU torch)
        run: pip install -r backend/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: |
          ruff check ingest backend evals tasks.py
          black --check ingest backend evals tasks.py
      - name: Tests
        run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
