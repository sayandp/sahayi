# Scheme sources for Sahayi ingestion.
#
# Schema per entry:
#   id            snake_case, unique; becomes the prefix of doc_id / chunk_id
#   scheme        human-readable scheme name
#   department    owning department / agency (used for the abstain contact)
#   level         state | central
#   lang          ml | en | both   (language(s) of the source documents)
#   urls          list of PDF or HTML page URLs: a plain string, or a mapping with
#                   url        (required)
#                   verify     true -> URL not confirmed to work / to be the right doc
#                   render     js -> render with headless Chromium (ingest/render.py)
#                   click      CSS selector clicked after load (ASP.NET postbacks)
#                   expect     text that must appear (inside `select`) after rendering
#                   select     CSS selector: keep only this element
#                   manual     true -> host unreachable from the build network; drop the
#                              file in data/raw/manual/{id}/ with {filename}.url.txt
#                   force_ocr  true -> OCR every page even if the PDF has a text layer
#   notes         free text
#   follow_links  optional, default true: for HTML pages, also download linked PDFs
#   render        optional entry-level default for `render`
#
# All URLs were taken from the official sites (myscheme slugs from myscheme's own
# search/state listings) and probed on 2026-10-12. `verify: true` marks the rest.
# myscheme.gov.in pages are rendered (render: js) and split into labelled sections:
# details / benefits / eligibility / exclusions / how_to_apply / documents / faq.

sources:
  # =================================================================== central
  # ---------------------------------------------------------- agriculture
  - id: pm_kisan
    scheme: Pradhan Mantri Kisan Samman Nidhi (PM-KISAN)
    department: Department of Agriculture & Farmers Welfare, Government of India
    level: central
    lang: en
    urls:
      - {url: https://www.myscheme.gov.in/schemes/pm-kisan, render: js}
      - https://pmkisan.gov.in/Documents/RevisedPM-KISANOperationalGuidelines(English).pdf
      - url: https://pmkisan.gov.in/Documents/RevisedFAQ.pdf
        force_ocr: true
    notes: >-
      RevisedFAQ.pdf is a scan with a poor embedded OCR layer, so it is re-OCR'd.
      pmkisan.gov.in serves an incomplete TLS chain (tls_verified=false).

  - id: pm_kmy
    scheme: Pradhan Mantri Kisan Maandhan Yojana (PM-KMY)
